<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse nutrition and health articles from Energise Nutrition."
    />
    <title>Articles | Energise Nutrition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="Energise Nutrition home">
          <span class="brand-mark" aria-hidden="true">EN</span>
          <span>Energise Nutrition</span>
        </a>

        <button
          id="menu-toggle"
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          Menu
        </button>

        <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
          <ul>
            <li><a href="articles.html" aria-current="page">Articles</a></li>
            <li><a href="index.html#recipes">Recipes</a></li>
            <li><a href="index.html#plans">Meal Plans</a></li>
            <li><a href="index.html#community">Community</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="section page-hero">
        <div class="container">
          <p class="eyebrow">Knowledge Library</p>
          <h1>Articles & Guides</h1>
          <p class="hero-copy">
            Search, filter, and explore practical nutrition guidance.
          </p>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container">
          <form id="article-search-form" class="search-bar" role="search">
            <label for="article-search">Search articles</label>
            <input
              id="article-search"
              name="query"
              type="search"
              placeholder="Search by title, topic, or keyword"
              autocomplete="off"
            />
          </form>
          <p id="article-count" class="search-count" aria-live="polite"></p>
          <div id="article-list" class="article-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>&copy; <span id="year"></span> Energise Nutrition</p>
        <a href="#top">Back to top</a>
      </div>
    </footer>

    <script src="../src/js/main.js"></script>
    <script src="../src/js/articles.js"></script>
  </body>
</html>

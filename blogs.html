<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link href="css/header.css" rel="stylesheet">
    <style>
        .flex-container-blogs {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .thumbnail {
            width: 200px;
            /* size of the thumbnail */
            height: 120px;
            overflow: hidden;
            /* hides anything outside the box */
            border-radius: 8px;
            /* optional: rounded corners */
            border: 2px solid #ddd;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* keeps the image nicely cropped */
        }
    </style>
</head>

<body>
    <div class="flex-container-blogs">
        <div id="header"></div>
        <div class="thumbnail">
            <a href="carbohydrates.html">
                <img src="/img/carbohydrates/carbs_transparent_png.png" alt="Thumbnail example">
            </a>
        </div>
    </div>
    <script src="/js/loadComponents.js"></script>
</body>

</html>

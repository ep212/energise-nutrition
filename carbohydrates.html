<!DOCTYPE html>
<html>
<head>
  <title>Carbohydrates</title>
</head>
<body>
  <p id="myParagraph"></p>
  <script>
    fetch("what_are_carbohydrates.txt")
      .then(response => response.text())
      .then(data => {
        document.getElementById("myParagraph").textContent = data;
      })
      .catch(error => console.error("Error loading text file:", error));
  </script>
</body>
</html>
